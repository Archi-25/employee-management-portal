# SonarQube / SonarCloud configuration
#
# Sonar is a static-analysis server: it reads the source, applies a large rule
# set (bugs, code smells, security hotspots, duplication) and tracks the results
# over time. This file tells the scanner what to look at.
#
# Running it needs two things this repository cannot ship:
#   1. the scanner CLI      — `brew install sonar-scanner`, or use the
#                             SonarCloud GitHub Action
#   2. somewhere to report  — a SonarQube server or a SonarCloud project,
#                             with SONAR_TOKEN set in the environment
#
#   SONAR_TOKEN=... npm run sonar
#
# Day to day the equivalent checks run locally through ESLint (`npm run lint`),
# which is wired into the same rules this project cares about.

sonar.projectKey=employee-management-portal
sonar.projectName=Employee Management Portal
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.spec.ts,\
  src/locale/**,\
  src/app/testing/**

sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Produced by `npm test` (vitest v8 coverage provider).
sonar.javascript.lcov.reportPaths=coverage/employee-management-portal/lcov.info

# --- Rule tuning -----------------------------------------------------------
# Only one exclusion, and it is scoped to test files. Application code is held
# to the full rule set: there is no `any`, no `bypassSecurityTrust*` call, and
# no suppression comment anywhere in src/app.
sonar.issue.ignore.multicriteria=e1

# S2699 — "add at least one assertion". A few specs assert by not throwing
# (for example that a directive is inert outside its host), which the rule
# cannot see. Scoped to specs so a real violation in application code is never
# silenced.
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.spec.ts
