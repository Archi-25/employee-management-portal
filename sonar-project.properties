# SonarQube / SonarCloud configuration
# Run with:  npx sonar-scanner  (or `npm run sonar`)
# A token is supplied out of band:  SONAR_TOKEN=... npm run sonar

sonar.projectKey=employee-management-portal
sonar.projectName=Employee Management Portal
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.spec.ts,\
  src/locale/**

sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Coverage is produced by `ng test --coverage` (vitest v8 provider).
sonar.javascript.lcov.reportPaths=coverage/employee-management-portal/lcov.info

# --- Rule tuning -----------------------------------------------------------
# The change-detection module exists to compare Default against OnPush, so the
# Default panel must keep its "suboptimal" strategy, and the security module
# must keep a literal XSS payload in a string for the sanitiser to chew on.
sonar.issue.ignore.multicriteria=e1,e2,e3

# S6268 (disabling Angular's built-in sanitisation) — the security lab calls
# bypassSecurityTrustHtml on a developer-authored constant, on purpose.
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.e1.resourceKey=src/app/features/security/**

# S1848 (object instantiated but never used) — the RxJS lab constructs
# observables to demonstrate that a producer only runs once subscribed.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1848
sonar.issue.ignore.multicriteria.e2.resourceKey=src/app/features/rxjs-lab/**

# S2699 (assertion-free test) — none expected; kept scoped to specs so a real
# violation elsewhere is never silenced.
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.spec.ts
