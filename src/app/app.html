<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <a class="brand" routerLink="/dashboard">
    <span class="brand__mark" aria-hidden="true">EMP</span>
    <span class="brand__name" i18n="@@app.brand">Employee Management Portal</span>
  </a>

  <button
    type="button"
    class="topbar__toggle"
    (click)="menuOpen.set(!menuOpen())"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Toggle navigation"
  >
    ☰
  </button>

  <nav class="nav" [class.is-open]="menuOpen()" aria-label="Main">
    @for (item of visibleNav(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
        (click)="menuOpen.set(false)"
      >
        <span class="nav__icon" aria-hidden="true">{{ item.icon }}</span>
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="session">
    <button
      type="button"
      class="icon-btn"
      (click)="theme.cycle()"
      [attr.aria-label]="'Theme: ' + themeLabel() + '. Change theme.'"
      [attr.title]="'Theme: ' + themeLabel()"
    >
      <span aria-hidden="true">{{ themeIcon() }}</span>
    </button>

    @if (auth.isAuthenticated()) {
      <app-notification-bell />

      <div class="account" (appClickOutside)="accountOpen.set(false)">
        <button
          type="button"
          class="account__trigger"
          [attr.aria-expanded]="accountOpen()"
          (click)="accountOpen.set(!accountOpen())"
        >
          <span class="account__avatar">{{ auth.displayName() | initials }}</span>
          <span class="account__who">
            <strong>{{ auth.displayName() }}</strong>
            <small>{{ auth.role() }}</small>
          </span>
        </button>

        @if (accountOpen()) {
          <div class="account__menu" role="menu">
            <a role="menuitem" routerLink="/settings" (click)="accountOpen.set(false)">
              Profile &amp; settings
            </a>
            <button role="menuitem" type="button" (click)="signOut()" i18n="@@app.signout">
              Sign out
            </button>
          </div>
        }
      </div>
    } @else {
      <a class="btn btn--sm" routerLink="/login" i18n="@@app.signin">Sign in</a>
    }
  </div>
</header>

<main id="main" class="shell">
  <router-outlet />
</main>

<footer class="footer">
  <span>{{ config.appName }}</span>
</footer>

<app-toast-host />
