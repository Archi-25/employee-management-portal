<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <a class="brand" routerLink="/dashboard">
    <span class="brand__mark">EMP</span>
    <span class="brand__name" i18n="@@app.brand">Employee Management Portal</span>
  </a>

  <button
    type="button"
    class="topbar__toggle"
    (click)="menuOpen.set(!menuOpen())"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Toggle navigation"
  >
    ☰
  </button>

  <nav class="nav" [class.is-open]="menuOpen()">
    @for (item of visibleNav(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
        (click)="menuOpen.set(false)"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="session">
    <span [appRoleBadge]="auth.role()" class="session__badge"></span>
    <select
      class="session__role"
      [value]="auth.role()"
      (change)="switchRole($any($event.target).value)"
      aria-label="Simulate role"
    >
      @for (role of roles; track role) {
        <option [value]="role">{{ role }}</option>
      }
    </select>

    @if (auth.isAuthenticated()) {
      <button type="button" class="btn btn--ghost btn--sm" (click)="signOut()" i18n="@@app.signout">
        Sign out
      </button>
    } @else {
      <a class="btn btn--sm" routerLink="/login" i18n="@@app.signin">Sign in</a>
    }
  </div>
</header>

<main id="main" class="shell">
  <router-outlet />
</main>

<footer class="footer">
  <span>{{ config.appName }}</span>
  <span class="footer__sep">·</span>
  <span>Angular 22 · standalone · zoneless · SSR</span>
</footer>

<app-toast-host />
